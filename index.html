<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6d5bd0"><link rel="manifest" href="./manifest.webmanifest"><title>儿童身高记录</title>
<style>
:root{--p:#6d5bd0;--bg:#f6f5fb;--ink:#29263d;--muted:#77758b;--line:#e9e7f2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,sans-serif}header{padding:24px 18px;background:linear-gradient(135deg,#6d5bd0,#a18de9);color:white;border-radius:0 0 24px 24px}h1{font-size:25px;margin:0 0 6px}header p{margin:0;font-size:14px}main{max-width:700px;margin:auto;padding:15px;display:grid;gap:13px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 4px 18px #28204c08}h2{font-size:17px;margin:0 0 13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:6px}.full{grid-column:1/-1}label{font-size:13px;color:var(--muted)}input,textarea,select{width:100%;font:inherit;padding:11px;border:1px solid #dcd9e9;border-radius:11px;background:white;color:var(--ink)}textarea{min-height:66px}button{border:0;border-radius:11px;padding:11px 13px;font:inherit;font-weight:600;background:var(--p);color:white}.secondary{background:#efedfa;color:#4b3caf}.danger{background:#fff0f2;color:#b94b62}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{padding:12px;background:#f7f5ff;border-radius:13px;min-width:0}.stat span{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.stat strong{font-size:19px;overflow-wrap:anywhere}.stat small{font-size:11px;color:var(--muted)}canvas{width:100%;height:230px;display:block}.note,footer{font-size:12px;color:var(--muted);line-height:1.6}.entry{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.entry:last-child{border:0}.entry p{margin:4px 0 0;color:var(--muted);font-size:13px;white-space:pre-wrap}.right{text-align:right;flex-shrink:0}.entry button{padding:7px 9px;font-size:12px;margin-top:6px}.empty{text-align:center;color:var(--muted);padding:18px 0;font-size:14px}@media(max-width:420px){.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}}
</style></head><body>
<header><h1>🌱 儿童身高记录</h1><p>记录每一次成长，看见一点一滴的变化。</p></header><main>
<section class="card"><h2>孩子资料</h2><div class="grid">
<div class="field"><label>孩子昵称</label><input id="name" placeholder="例如：小朋友"></div>
<div class="field"><label>出生日期（可选）</label><input id="birth" type="date"></div>
<div class="field"><label>目标身高（cm，可选）</label><input id="goal" type="number" min="1" max="250" step=".1" placeholder="例如：170"></div>
<div class="field"><label>显示单位</label><select id="unit"><option value="cm">厘米（cm）</option><option value="in">英寸（in）</option></select></div></div><div class="actions"><button id="saveProfile">保存资料</button></div></section>
<section class="card"><h2 id="formTitle">添加身高记录</h2><div class="grid">
<div class="field"><label>测量日期</label><input id="date" type="date"></div>
<div class="field"><label>身高（厘米）</label><input id="height" type="number" min="20" max="250" step=".1" placeholder="例如：133.5"></div>
<div class="field full"><label>备注（可选）</label><textarea id="comment" placeholder="例如：早上测量、刚体检、穿袜子等"></textarea></div></div>
<div class="actions"><button id="save">保存记录</button><button class="secondary" id="cancel" hidden>取消编辑</button></div></section>
<section class="card"><h2>成长概览</h2><div class="stats"><div class="stat"><span>最近身高</span><strong id="latest">—</strong><small id="latestDate">还没有记录</small></div><div class="stat"><span>累计增长</span><strong id="growth">—</strong><small id="period">至少需要两次记录</small></div><div class="stat"><span>目标身高</span><strong id="goalStat">—</strong><small id="goalLeft">可在孩子资料中设置</small></div></div></section>
<section class="card"><h2>身高趋势</h2><canvas id="chart"></canvas><p class="note">图表展示录入的数据，不代表医学评估或身高百分位。建议尽量使用相近的测量方法和时间。</p></section>
<section class="card"><h2>历史记录</h2><div id="history"></div><div class="actions"><button class="secondary" id="export">导出备份（JSON）</button><button class="secondary" id="importBtn">导入备份</button><button class="danger" id="clear">清空所有数据</button><input id="file" type="file" accept="application/json,.json" hidden></div></section>
<footer>数据仅保存在当前设备的浏览器中，不会自动上传。请定期导出备份。清除 Safari 网站数据可能导致记录丢失。本工具仅用于记录，不提供医学诊断或生长百分位评估。</footer></main>
<script>
const $=x=>document.getElementById(x),KEY='myChildHeight.v1';let s={profile:{name:'',birth:'',goal:'',unit:'cm'},entries:[],editing:null};$('date').value=new Date().toISOString().slice(0,10);
function load(){try{let x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&Array.isArray(x.entries))s=x}catch(e){}$('name').value=s.profile.name||'';$('birth').value=s.profile.birth||'';$('goal').value=s.profile.goal||'';$('unit').value=s.profile.unit||'cm';render()}
function save(){localStorage.setItem(KEY,JSON.stringify(s))}
function fmt(n){return Number(n).toFixed(1).replace(/\.0$/,'')}
function show(n){return s.profile.unit==='in'?fmt(n/2.54)+' in':fmt(n)+' cm'}
function entries(){return [...s.entries].sort((a,b)=>a.date.localeCompare(b.date))}
function render(){let es=entries(),last=es[es.length-1];$('latest').textContent=last?show(last.height):'—';$('latestDate').textContent=last?last.date:'还没有记录';
if(es.length>1){let d=es[es.length-1].height-es[0].height;$('growth').textContent=(d>=0?'+':'')+fmt(s.profile.unit==='in'?d/2.54:d)+(s.profile.unit==='in'?' in':' cm');$('period').textContent=es[0].date+' 至 '+last.date}else{$('growth').textContent='—';$('period').textContent='至少需要两次记录'}
let g=Number(s.profile.goal);$('goalStat').textContent=g>0?show(g):'—';$('goalLeft').textContent=g>0&&last?(g>last.height?'还差 '+show(g-last.height):'已达到或超过目标'):'可在孩子资料中设置';
let h=$('history');h.innerHTML='';if(!es.length)h.innerHTML='<div class="empty">还没有身高记录，添加第一条吧。</div>';es.slice().reverse().forEach(e=>{let row=document.createElement('div');row.className='entry';let l=document.createElement('div'),b=document.createElement('strong'),p=document.createElement('p');b.textContent=show(e.height);p.textContent=e.date+(e.comment?' · '+e.comment:'');l.append(b,p);let r=document.createElement('div');r.className='right';let ed=document.createElement('button');ed.className='secondary';ed.textContent='编辑';ed.onclick=()=>edit(e.id);let de=document.createElement('button');de.className='danger';de.textContent='删除';de.onclick=()=>del(e.id);r.append(ed,de);row.append(l,r);h.append(row)});chart(es)}
function chart(es){let c=$('chart'),ctx=c.getContext('2d'),dpr=devicePixelRatio||1,w=c.clientWidth||300,H=230;c.width=w*dpr;c.height=H*dpr;ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,H);let p={l:40,r:12,t:14,b:30};if(!es.length){ctx.fillStyle='#77758b';ctx.textAlign='center';ctx.font='14px sans-serif';ctx.fillText('添加记录后即可查看趋势',w/2,H/2);return}let vs=es.map(e=>e.height),mn=Math.floor(Math.min(...vs)-2),mx=Math.ceil(Math.max(...vs)+2);if(mx-mn<5){mn-=2;mx+=2}let x=i=>p.l+(es.length===1?(w-p.l-p.r)/2:i/(es.length-1)*(w-p.l-p.r)),y=v=>p.t+(mx-v)/(mx-mn)*(H-p.t-p.b);ctx.font='11px sans-serif';ctx.textAlign='right';for(let i=0;i<5;i++){let v=mn+(mx-mn)*i/4,yy=y(v);ctx.strokeStyle='#eceaf4';ctx.beginPath();ctx.moveTo(p.l,yy);ctx.lineTo(w-p.r,yy);ctx.stroke();ctx.fillStyle='#77758b';ctx.fillText(fmt(v),p.l-6,yy+4)}if(es.length>1){ctx.strokeStyle='#6d5bd0';ctx.lineWidth=2.5;ctx.beginPath();es.forEach((e,i)=>i?ctx.lineTo(x(i),y(e.height)):ctx.moveTo(x(i),y(e.height)));ctx.stroke()}es.forEach((e,i)=>{ctx.fillStyle='#6d5bd0';ctx.beginPath();ctx.arc(x(i),y(e.height),4,0,Math.PI*2);ctx.fill();if(i===0||i===es.length-1||es.length<=4){ctx.fillStyle='#49445f';ctx.textAlign=i===0?'left':i===es.length-1?'right':'center';ctx.fillText(e.date.slice(5),x(i),H-9)}})}
function reset(){s.editing=null;$('formTitle').textContent='添加身高记录';$('save').textContent='保存记录';$('cancel').hidden=true;$('date').value=new Date().toISOString().slice(0,10);$('height').value='';$('comment').value=''}
$('saveProfile').onclick=()=>{s.profile={name:$('name').value.trim(),birth:$('birth').value,goal:$('goal').value,unit:$('unit').value};save();render();alert('孩子资料已保存。')};
$('save').onclick=()=>{let date=$('date').value,height=Number($('height').value);if(!date||!Number.isFinite(height)||height<20||height>250){alert('请输入有效日期和身高（20–250 厘米）。');return}let e={id:s.editing||String(Date.now()),date,height,comment:$('comment').value.trim()},i=s.entries.findIndex(x=>x.id===e.id);if(i>=0)s.entries[i]=e;else s.entries.push(e);save();reset();render()};
function edit(id){let e=s.entries.find(x=>x.id===id);s.editing=id;$('formTitle').textContent='编辑身高记录';$('save').textContent='保存修改';$('cancel').hidden=false;$('date').value=e.date;$('height').value=e.height;$('comment').value=e.comment||'';scrollTo({top:0,behavior:'smooth'})}
function del(id){if(confirm('确定删除这条记录吗？')){s.entries=s.entries.filter(e=>e.id!==id);save();render()}}
$('cancel').onclick=reset;$('unit').onchange=()=>{s.profile.unit=$('unit').value;save();render()};
$('export').onclick=()=>{let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'}));a.href=u;a.download='child-height-backup.json';a.click();URL.revokeObjectURL(u)};
$('importBtn').onclick=()=>$('file').click();$('file').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!x.profile||!Array.isArray(x.entries))throw 0;if(confirm('导入会替换当前数据，继续吗？')){s=x;save();$('name').value=s.profile.name||'';$('birth').value=s.profile.birth||'';$('goal').value=s.profile.goal||'';$('unit').value=s.profile.unit||'cm';render();alert('导入成功')}}catch(err){alert('无法读取此备份文件')}e.target.value=''};
$('clear').onclick=()=>{if(confirm('确定清空所有资料和记录吗？此操作无法撤销。')){s={profile:{name:'',birth:'',goal:'',unit:'cm'},entries:[],editing:null};save();$('name').value='';$('birth').value='';$('goal').value='';$('unit').value='cm';reset();render()}};
window.addEventListener('resize',()=>chart(entries()));if('serviceWorker'in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));load();
</script></body></html>
